    <script>
      (function() {
        // Gracefully ignore Vite HMR WebSocket connection errors as specified by environment rules
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) {
            return (a && (a.stack || a.message || String(a))) || '';
          }).join(' ');
          if (
            text.indexOf('@vite/client') !== -1 ||
            text.indexOf('WebSocket closed without opened') !== -1 ||
            text.indexOf('vite-hmr') !== -1 ||
            text.indexOf('failed to connect to WebSocket') !== -1
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var text = (reason && (reason.stack || reason.message || String(reason))) || '';
          if (
            text.indexOf('WebSocket') !== -1 ||
            text.indexOf('@vite/client') !== -1 ||
            text.indexOf('vite-hmr') !== -1
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var text = event.message || (event.error && (event.error.stack || event.error.message)) || '';
          if (
            text.indexOf('WebSocket') !== -1 ||
            text.indexOf('@vite/client') !== -1 ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1)
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
